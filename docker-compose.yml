services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: natura-travel-server
    restart: unless-stopped
    ports:
      - "3600:3600"
    env_file:
      - ./Server/.env
    environment:
      - NODE_ENV=production
      - PORT=3600

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3600
    container_name: natura-travel-client
    restart: unless-stopped
    ports:
      - "5173:3000"
    env_file:
      - ./Client/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - server

